server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: localbite-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  flyway:
    enabled: false # Handled via Hibernate in unit/integration test slices

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  razorpay:
    key-id: rzp_test_mock
    key-secret: mock_secret
    webhook-secret: mock_webhook_secret
  upload:
    dir: target/test-uploads
